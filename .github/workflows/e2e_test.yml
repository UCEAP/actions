name: End-to-end test
on:
  workflow_call:
    inputs:
      TERMINUS_SITE:
        description: 'The Pantheon site to run tests against'
        required: true
        type: string
      TERMINUS_ENV:
        description: 'The site environment to run tests against'
        required: true
        type: string
      CYPRESS_PROJECT_ID:
        description: 'Cypress project ID for recording tests'
        required: true
        type: string
      OP_VAULT:
        description: '1Password vault containing project-specific secrets'
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  BASE_BRANCH: ${{ github.base_ref }}

jobs:
  check_freshness:
    name: Branch freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deliberately the head branch rather than the pull_request merge ref
          # that actions/checkout defaults to. The merge ref contains the base
          # branch by construction, so checking it out would make this job
          # vacuously pass.
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify the branch contains the tip of its base branch
        run: |
          # A push to qa or master has no base branch to compare against.
          # Succeed so the jobs that need this one still run.
          if [ -z "$BASE_BRANCH" ]; then
            echo "Not a pull request; nothing to compare."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          if git merge-base --is-ancestor "origin/$BASE_BRANCH" HEAD; then
            echo "$CI_BRANCH contains the tip of $BASE_BRANCH."
            exit 0
          fi
          # The site under test is built and deployed from the head branch,
          # while Cypress runs the specs from the pull_request merge ref. A
          # branch that is behind therefore runs specs added to the base branch
          # since the last sync against a site built without the code those
          # specs cover. The failures look like a regression in this pull
          # request but are not, so stop here instead of spending 20 minutes
          # producing a misleading red X.
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE_BRANCH")
          echo "$CI_BRANCH is $BEHIND commit(s) behind $BASE_BRANCH:"
          git log --oneline --no-decorate "HEAD..origin/$BASE_BRANCH"
          echo "::error title=Branch is behind $BASE_BRANCH::$CI_BRANCH is $BEHIND commit(s) behind $BASE_BRANCH. Merge $BASE_BRANCH into it and push, then re-run all jobs. End-to-end tests are skipped until then because they would run the base branch's newest specs against a site built from this branch's older code."
          exit 1

  prepare_pantheon:
    name: Prepare Pantheon
    needs: check_freshness
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: op://${{ inputs.OP_VAULT }}/pantheon-ssh/private key
          TERMINUS_TOKEN: op://${{ inputs.OP_VAULT }}/pantheon-terminus/credential
      - name: Create Pantheon environment
        env:
          TERMINUS_SITE: ${{ inputs.TERMINUS_SITE }}
          TERMINUS_ENV: ${{ inputs.TERMINUS_ENV }}
        run: |
          terminus -n auth:login --machine-token="$TERMINUS_TOKEN"
          set +e
          terminus -n env:info --quiet; PANTHEON_SITE_EXISTS=$((!$?))
          set -e
          if [ $PANTHEON_SITE_EXISTS -ne 0 ]; then
            terminus -n env:delete --yes
          fi
          terminus -n auth:login --machine-token="$TERMINUS_TOKEN"
          terminus multidev:create $TERMINUS_SITE.dev $TERMINUS_ENV

  deploy_to_pantheon:
    name: Deploy to Pantheon
    needs: prepare_pantheon
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-build
      - name: Fix file modes
        run: find scripts vendor/bin -type f | xargs chmod +x
      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TERMINUS_TOKEN: op://${{ inputs.OP_VAULT }}/pantheon-terminus/credential
          SSH_PRIVATE_KEY: op://${{ inputs.OP_VAULT }}/pantheon-ssh/private key
      - name: deploy to Pantheon
        env:
          TERMINUS_SITE: ${{ inputs.TERMINUS_SITE }}
          TERMINUS_ENV: ${{ inputs.TERMINUS_ENV }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ../private.key
          chmod 600 ../private.key
          eval `ssh-agent -s`
          ssh-add ../private.key
          uceap deploy-to-multidev

  e2e_test:
    name: Feature tests
    needs: deploy_to_pantheon
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.ref_name != 'master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CYPRESS_RECORD_KEY: op://${{ inputs.OP_VAULT }}/cypress-record-key/notesPlain
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: tests
          config: baseUrl=https://${{ inputs.TERMINUS_ENV }}-${{ inputs.TERMINUS_SITE }}.pantheonsite.io
          record: true
        env:
          CYPRESS_PROJECT_ID: ${{ inputs.CYPRESS_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup_pantheon:
    name: Cleanup Pantheon
    needs: e2e_test
    # Always tear the multidev down, even when the tests fail. Otherwise the
    # multidev is left standing with data mutated by the failed run, and a
    # subsequent "re-run failed jobs" reuses that dirty database (prepare/deploy
    # do not re-run), causing confusing follow-on failures. Making the multidev
    # ephemeral per run forces "re-run all jobs" (which reseeds via
    # prepare_pantheon) and eliminates the dirty-reuse footgun.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TERMINUS_TOKEN: op://${{ inputs.OP_VAULT }}/pantheon-terminus/credential
      - name: Delete Pantheon environment
        env:
          TERMINUS_SITE: ${{ inputs.TERMINUS_SITE }}
          TERMINUS_ENV: ${{ inputs.TERMINUS_ENV }}
        run: |
          terminus -n auth:login --machine-token="$TERMINUS_TOKEN"
          # Guard the delete: with `if: always()` this job also runs when
          # prepare_pantheon failed and never created the multidev, in which
          # case env:delete would error and turn cleanup red for no reason.
          set +e
          terminus -n env:info --quiet; PANTHEON_SITE_EXISTS=$((!$?))
          set -e
          if [ $PANTHEON_SITE_EXISTS -ne 0 ]; then
            terminus -n env:delete --yes
          fi

