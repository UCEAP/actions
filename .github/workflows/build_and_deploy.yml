name: Build and deploy
on:
  workflow_call:
    inputs:
      TERMINUS_SITE:
        description: 'The Pantheon site to deploy to'
        required: true
        type: string
      OP_VAULT:
        description: '1Password vault containing project-specific secrets'
        required: true
        type: string
      JIRA_EMAIL:
        description: 'The email address for Jira API authentication'
        required: true
        type: string
      JIRA_PROJECT_KEY:
        description: 'The Jira project key for the site'
        required: true
        type: string
    outputs:
      TERMINUS_ENV:
        description: 'The Pantheon environment to deploy to'
        value: ${{ jobs.prepare_pantheon.outputs.terminus_env }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: read
  pull-requests: write
defaults:
  run:
    shell: bash
env:
  TZ: "/usr/share/zoneinfo/America/Los_Angeles"
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  BASE_BRANCH: ${{ github.base_ref }}

jobs:
  build_deployment:
    name: Build for deployment
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    if: github.head_ref != 'qa' && github.head_ref != 'master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Build project for deployment
        run: composer -n install --no-dev --optimize-autoloader
      - name: Build theme for deployment
        run: |
          if composer run-script --list | grep -qE '^[[:space:]]+ci-compile-theme([[:space:]]|$)'; then
            composer -n ci-compile-theme
          else
            echo "No ci-compile-theme script defined in composer.json; skipping."
          fi
      - name: Build React app(s) for deployment
        run: |
          if composer run-script --list | grep -qE '^[[:space:]]+ci-compile-react([[:space:]]|$)'; then
            composer -n ci-compile-react
          else
            echo "No ci-compile-react script defined in composer.json; skipping."
          fi
      - name: Build docs for deployment
        run: |
          if composer run-script --list | grep -qE '^[[:space:]]+ci-compile-docs([[:space:]]|$)'; then
            composer -n ci-compile-docs
          else
            echo "No ci-compile-docs script defined in composer.json; skipping."
          fi
      - name: Remove files that should not be deployed
        run: |
          sed -n '/# *:.*cut.*:/,$p' .gitignore > ../deploy.gitignore
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git ls-files -X ../deploy.gitignore -oi | xargs rm -rf
          find . -name .git -exec rm -rf {} +
          cp ../deploy.gitignore .gitignore
      - name: Upload deployment build artifact
        uses: actions/upload-artifact@v4
        with:
          path: .
          name: deployment-build
          include-hidden-files: true
          retention-days: 1

  build_dev:
    name: Build for development
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    if: github.head_ref != 'qa' && github.head_ref != 'master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Prep for build
        run: composer -n dev-initialize-local
      - name: Build project for development
        run: composer -n install
      - name: Upload dev build artifact
        uses: actions/upload-artifact@v4
        with:
          path: .
          name: dev-build
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Check lint
    needs: [build_dev]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-build
      # TODO think about using tar for our artifacts: https://github.com/actions/upload-artifact?tab=readme-ov-file#permission-loss
      - name: Fix file modes
        run: chmod +x ./vendor/bin/*
      - name: PHP lint project custom modules and theme
        run: composer -n lint-parallel

  coding_standards:
    name: Coding standards
    needs: [build_dev]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-build
      - name: Fix file modes
        run: chmod +x ./vendor/bin/*
      - name: Fix dubious ownership error
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Check PHP coding standards for project custom modules and theme
        run: |
          if [ -n "$BASE_BRANCH" ]; then
            if ! git diff --quiet --diff-filter=d origin/$BASE_BRANCH... -- '*.php' '*.module' '*.inc' '*.install' '*.test' '*.profile' '*.theme' '*.info'; then
              composer -n code-sniff-feature
            else
              echo "No changes to relevant files."
            fi
          else
            composer -n code-sniff
          fi

  static_analysis:
    name: Static analysis
    needs: [build_dev]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-build
      - name: Fix file modes
        run: chmod +x ./vendor/bin/*
      - name: Fix dubious ownership error
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run static analysis on custom modules and theme
        run: |
          if [ -n "$BASE_BRANCH" ]; then
            if ! git diff --quiet --diff-filter=d origin/$BASE_BRANCH... -- '*.php' '*.module' '*.inc' '*.install' '*.test' '*.profile' '*.theme' '*.info'; then
              composer -n static-analysis-feature
            else
              echo "No changes to relevant files."
            fi
          else
            composer -n static-analysis
          fi

  unit_test:
    name: Unit tests
    needs: [build_dev]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-build
      - name: Fix file modes
        run: chmod +x ./vendor/bin/*
      - name: run acceptance tests with php-unit
        run: composer -n unit-test-ci
      - name: Upload artifacts
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: ./tests/artifacts/coverage

  prepare_pantheon:
    name: Prepare Pantheon
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    outputs:
      terminus_env: ${{ steps.determine_pantheon_env.outputs.terminus_env }}
    if: github.head_ref != 'qa' && github.head_ref != 'master' && github.actor != 'dependabot[bot]'
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Determine Pantheon environment
        id: determine_pantheon_env
        run: |
          if [ -z "$PR_NUMBER" ]; then
            case "$CI_BRANCH" in
              main|master) export TERMINUS_ENV=dev ;;
              qa) export TERMINUS_ENV=qa ;;
              *) exit 1 ;; # we should never get here
            esac
          else
            export TERMINUS_ENV=pr-$PR_NUMBER
          fi
          echo TERMINUS_ENV=$TERMINUS_ENV >> $GITHUB_ENV
          echo terminus_env=$TERMINUS_ENV >> $GITHUB_OUTPUT

      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          JIRA_API_TOKEN: op://secrets-shared/atlassian-api/credential
          SSH_PRIVATE_KEY: op://${{ inputs.OP_VAULT }}/pantheon-ssh/private key
          TERMINUS_TOKEN: op://${{ inputs.OP_VAULT }}/pantheon-terminus/credential
      - name: Create Pantheon environment
        env:
          JIRA_PROJECT_KEY: ${{ inputs.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ inputs.JIRA_EMAIL }}
          TERMINUS_SITE: ${{ inputs.TERMINUS_SITE }}
        run: |
          terminus -n auth:login --machine-token="$TERMINUS_TOKEN"
          set +e
          terminus -n env:info --quiet; PANTHEON_SITE_EXISTS=$((!$?))
          set -e
          if [ $PANTHEON_SITE_EXISTS -eq 0 ]; then
            terminus multidev:create $TERMINUS_SITE.dev $TERMINUS_ENV
            curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              --request POST \
              --data '{"body": "Created feature testing environment at https://'$TERMINUS_ENV'-'$TERMINUS_SITE'.pantheonsite.io/"}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$PR_NUMBER/comments"
          fi

      # Put the multidev on the Jira ticket, so whoever tests the change finds
      # it where the work is tracked. The ticket is the site's project key in
      # the PR title (`UOS-134: …`) or, failing that, the branch
      # (`UOS-134-keyboard-accessibility`); a PR naming neither is left alone.
      # The URL is the link's global ID, so every push re-links the same
      # environment rather than adding another. Nothing removes it when the
      # multidev is cleaned up -- a dead link on a finished ticket is harmless.
      # Visibility only: a Jira failure warns and never fails the build.
      - name: Link the multidev from the Jira ticket
        if: github.event.pull_request.number
        continue-on-error: true
        env:
          JIRA_PROJECT_KEY: ${{ inputs.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ inputs.JIRA_EMAIL }}
          TERMINUS_SITE: ${{ inputs.TERMINUS_SITE }}
          # Through env, never interpolated into the script: a PR title is
          # whatever its author typed.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! [[ "$JIRA_PROJECT_KEY" =~ ^[A-Z][A-Z0-9]*$ ]]; then
            echo "::warning::JIRA_PROJECT_KEY '$JIRA_PROJECT_KEY' is not a Jira project key; not linking the multidev."
            exit 0
          fi

          key=$(printf '%s\n%s\n' "$PR_TITLE" "$CI_BRANCH" \
            | grep -oiE "\b${JIRA_PROJECT_KEY}-[0-9]+\b" | head -n1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$key" ]; then
            echo "No $JIRA_PROJECT_KEY ticket in the PR title or branch; nothing to link."
            exit 0
          fi

          url="https://${TERMINUS_ENV}-${TERMINUS_SITE}.pantheonsite.io/"
          payload=$(jq -n --arg url "$url" --arg env "$TERMINUS_ENV" '{
            globalId: $url,
            object: {
              url: $url,
              title: "Multidev \($env) (feature testing)",
              icon: {url16x16: "https://pantheon.io/favicon.ico", title: "Pantheon"}
            }
          }')

          status=$(curl -sS -o jira-response.json -w '%{http_code}' -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://uceapit.atlassian.net/rest/api/2/issue/$key/remotelink")

          case "$status" in
            200|201) echo "Linked $url from $key." ;;
            401) echo "::warning::Jira did not accept JIRA_EMAIL ($JIRA_EMAIL) with the API token; the multidev was not linked from $key." ;;
            *) echo "::warning::Could not link the multidev from $key (HTTP $status): $(head -c 300 jira-response.json)" ;;
          esac

  deploy_to_pantheon:
    name: Deploy to Pantheon
    needs: [build_deployment, prepare_pantheon]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/uceap/devcontainer-drupal:main
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-build
      - name: Fix file modes
        run: find scripts vendor/bin -type f | xargs chmod +x
      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TERMINUS_TOKEN: op://${{ inputs.OP_VAULT }}/pantheon-terminus/credential
          SSH_PRIVATE_KEY: op://${{ inputs.OP_VAULT }}/pantheon-ssh/private key
      - name: deploy to Pantheon
        env:
          TERMINUS_SITE: ${{ inputs.TERMINUS_SITE }}
          TERMINUS_ENV: ${{ needs.prepare_pantheon.outputs.terminus_env }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ../private.key
          chmod 600 ../private.key
          eval `ssh-agent -s`
          ssh-add ../private.key
          if [ $TERMINUS_ENV == "dev" ]; then
            uceap deploy-to-dev
          else
            uceap deploy-to-multidev
          fi

