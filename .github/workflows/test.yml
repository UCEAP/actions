name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Lints only the workflows this PR (or push) adds or changes, so
      # touching an existing workflow means fixing its findings too. Same
      # practice as phpstan.feature.neon in our Drupal repos. If there is no
      # usable base commit (e.g. a new branch), every workflow is linted.
      - name: Lint changed workflows (actionlint)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          patterns=('.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2> /dev/null; then
            base=$(git merge-base "$BASE_SHA" HEAD)
            mapfile -t files < <(git diff --name-only --diff-filter=d "$base" HEAD -- "${patterns[@]}")
          else
            echo "No usable base commit; linting every workflow."
            mapfile -t files < <(git ls-files -- "${patterns[@]}")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow changes to lint."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color "${files[@]}"
      - name: Lint scripts (ShellCheck)
        run: shellcheck scripts/*.sh test/stubs/gh test/test_helper.bash
      - name: Unit tests (bats)
        run: npx --yes bats@1.11.1 test
